[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schemawright"
version = "0.1.1"
description = "Project-agnostic SQL migration lifecycle tool."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Schemawright Contributors"}]
keywords = ["sql", "database", "migrations", "schema", "cli"]
dependencies = ["captain-core>=0.1,<0.2"]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
sqlserver = ["pyodbc>=5.0"]
oracle = ["oracledb>=2.0"]
duckdb = ["duckdb>=1.0"]
all = ["pymysql>=1.1", "psycopg[binary]>=3.1", "pyodbc>=5.0", "oracledb>=2.0", "duckdb>=1.0"]
dev = ["pytest>=8.0"]
test = ["pytest>=8.0"]

[project.scripts]
schemawright = "schemawright.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["schemawright*"]
